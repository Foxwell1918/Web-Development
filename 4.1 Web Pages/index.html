On HTML BoilerPlates

A Boilerplate is something you start with before starting a project. 
It is a template that has the basic structure of a project, and you can build upon it.

Example:

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
      <title> My Website </title>
    </head>

    <body>
        <h1> Welcome to my website! </h1>
    </body>
</html>

---

At the top of the HTML file, we have the DOCTYPE declaration, 
which tells the browser that this is an HTML5 document.

the next time is the actual <html> </html>, everything will be between these tags

The Lang is the language used in the document, and it is important for accessibility and SEO.

Every website is a Burger

The Next part of the HTML element is the <head> </head> element, 
which contains meta information about the document, such as the character set, title, 
and links to stylesheets and scripts.

What you should have in every <head> element is the <meta> tag to specigy the character used 
in the document, which is usually UTF-8 using the value charset.

It ensures your characters are displayed correctly in the browser.

Then what you need to have is the <title> </title> element, 
which specifies the title of the document, it is the title shown on top of the browser tab, 
and it is important for SEO.

The Next part of the HTML element is the <body> </body> element,
which contains the content of the document, such as text, images, links, and other elements
Inside the body element is the majority of our time writing the website
this is the content of the website goes
everything in the HTML code is in between the Body tag

It is easier to understand HTML coding with the analogy of the burger, 
the <html> </html> is the bun, the <head> </head> is the top bun, 
and the <body> </body> is the bottom bun, 
and everything in between is the content of the burger.

Although, you don't need to type all of those

You can just type ! and then enter and it will automatically generate the boilerplate for you,
and you can just add the content of your website in between the <body> </body>

-->
