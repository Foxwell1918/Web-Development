IMAGE ELEMENT

<img src="url" />

SRC is a srouce attribute, what is the source of the image, and the value will be the location of the image. 
For an image element, unlike the Anchor Element, it does not have a closing tag. It is a self-closing tag.
It's likea  void element.

Picsum.photos is a free image hosting site that allows you to use images for free. 
You can use the URL of the image as the value of the src attribute.



<img src="https://picsum.photos/200" />

The 200 at the end is the size of the image, you can change it to any number you want.

the ALT attribute is used to describe the image, 
and it is important for accessibility. 
It provides alternative text for screen readers and displays when the image cannot be loaded.

ALT means Alternate Text Description

IMAGE IS A SELF CLOSING TAG, IT DOES NOT HAVE A CLOSING TAG.



-->
